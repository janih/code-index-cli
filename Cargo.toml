[package]
name = "code-index"
version = "0.2.0"
edition = "2021"
description = "Standalone CLI tool for codebase indexing with semantic search"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
ignore = "0.4"
notify = "8"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v5"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
